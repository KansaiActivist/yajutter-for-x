<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ヤジュッター for X</title>
<style>
  body {
    width: 240px;
    margin: 0;
    padding: 16px;
    background-color: #000;
    color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 12px 0;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-top: 1px solid #2f3336;
  }
  .row span {
    font-size: 13px;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #3e4144;
    border-radius: 9999px;
    transition: background-color 0.15s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 2px;
    top: 2px;
    background-color: #fff;
    border-radius: 50%;
    transition: transform 0.15s ease;
  }
  input:checked + .slider {
    background-color: #1d9bf0;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }
  .note {
    font-size: 11px;
    color: #71767b;
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>ヤジュッター for X</h1>
  <div class="row">
    <span>X風UIを有効化</span>
    <label class="switch">
      <input type="checkbox" id="yx-toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="note">切り替え後はページを再読み込みしてください。</div>
  <script src="popup.js"></script>
</body>
</html>
